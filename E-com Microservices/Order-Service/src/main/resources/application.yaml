spring:
  application:
    name: Order-Service

server:
  port: 8083

  spring:
    datasource:
      url: jdbc:postgresql://localhost:3306/OrderServiceDb
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver

    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update # Options: none, validate, update, create, create-drop
      show-sql: true
      properties:
        hibernate:
          format_sql: true

logging:
  # General and package-specific log levels
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.yourpackage.auth: DEBUG

  # File output settings
  file:
    name: D:/Harshad/logs/auth-service.log

  # Rolling policy configuration for log retention
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

  # Custom log message formatting
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

